spring.application.name=cinex

# Base de datos: en local usa MySQL en localhost; en Docker o en la nube los valores
# llegan por variables de entorno (DB_URL, DB_USER, DB_PASSWORD).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cinex_db}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Orígenes que pueden llamar a la API desde el navegador (separados por coma)
cinex.cors.allowed-origins=${CORS_ORIGINS:*}

# Documentación de la API
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# El puerto lo puede asignar la plataforma de despliegue con PORT
server.port=${PORT:8080}
