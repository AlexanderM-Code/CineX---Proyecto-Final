# Configuración de pruebas: base de datos H2 en memoria que imita a MySQL.
spring.datasource.url=jdbc:h2:mem:cinex;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
cinex.cors.allowed-origins=*
