# Despliegue de la API en Render (plan gratuito, con Docker).
# El frontend se publica aparte en GitHub Pages (.github/workflows/pages.yml).
# La base de datos es TiDB Cloud Starter (compatible con MySQL, gratuita y sin
# apagados por inactividad): DB_URL, DB_USER y DB_PASSWORD se configuran en el
# panel de Render, nunca en el código.
services:
  - type: web
    name: cinex-api
    runtime: docker
    plan: free
    rootDir: CineX-Backend/cineX_spring_boot/demo
    dockerfilePath: ./Dockerfile
    healthCheckPath: /productos
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
